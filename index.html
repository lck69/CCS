<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📌 30+大學學員在職情況即時統計</title>
  <style>
    /* 全局採用微軟正黑體與現代化字重 */
    body {
      font-family: "Microsoft JhengHei", "Heiti TC", "Segoe UI", Roboto, sans-serif;
      background-color: #f0f3f8;
      margin: 0;
      padding: 12px;
      color: #2c3e50;
      -webkit-tap-highlight-color: transparent;
    }
    
    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px 16px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    /* 標題層次優化 */
    h2 {
      font-family: "Microsoft JhengHei", sans-serif;
      font-weight: 700;
      color: #1a365d;
      font-size: 20px;
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    h3 {
      font-family: "Microsoft JhengHei", sans-serif;
      font-weight: 700;
      color: #2b6cb0;
      font-size: 16px;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    /* 說明區塊 */
    .notice {
      background-color: #ebf8ff;
      border-left: 5px solid #3182ce;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
      border-radius: 0 8px 8px 0;
      color: #2d3748;
    }

    .notice strong {
      font-weight: 700;
      color: #2b6cb0;
    }

    /* 表單元件群組 */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 15px;
      color: #2d3748;
    }

    /* 手機友善的大尺寸下拉選單 */
    select {
      width: 100%;
      padding: 14px 12px;
      font-size: 16px; /* 防止 iOS 放大鏡效果 */
      font-family: "Microsoft JhengHei", sans-serif;
      font-weight: 600;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: #fff;
      color: #1a202c;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a5568' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 18px;
    }

    select:focus {
      border-color: #3182ce;
      outline: none;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    /* 按鈕樣式 (加大觸控面積) */
    .btn {
      width: 100%;
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 14px;
      font-size: 17px;
      font-family: "Microsoft JhengHei", sans-serif;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 6px rgba(49, 130, 206, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:hover {
      background-color: #2b6cb0;
    }

    .btn:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 複製按鈕專用色 (鮮明綠) */
    .copy-btn {
      background-color: #38a169;
      box-shadow: 0 4px 6px rgba(56, 161, 105, 0.2);
      margin-top: 12px;
    }

    .copy-btn:hover {
      background-color: #2f855a;
    }

    /* 結果顯示框 */
    .result-box {
      margin-top: 10px;
      background: #f7fafc;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #1a202c;
      max-height: 240px;
      overflow-y: auto;
    }

    .loading {
      text-align: center;
      color: #718096;
      font-style: italic;
      padding: 12px;
      font-weight: 600;
    }

    hr {
      margin: 22px 0;
      border: 0;
      border-top: 2px solid #edf2f7;
    }

    /* 響應式平板與電腦微調 */
    @media (min-width: 600px) {
      body {
        padding: 30px;
      }
      .container {
        padding: 30px 24px;
      }
      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📌 30+大學學員在職情況統計</h2>
  
  <div class="notice">
    <strong>💡 填寫說明：</strong><br>
    • <strong>全職</strong>：從事有領薪資的專職工作。<br>
    • <strong>兼職</strong>：從事非屬全職的工作。<br>
    • <strong>未在職</strong>：入學前沒有從事工作。<br>
    📅 <strong>填寫期限：10/15（四）前</strong><br><br>
    <em>操作方式：請直接於下方點選您的姓名與狀態，送出後全班名單將即時連動更新！</em>
  </div>

  <div class="form-group">
    <label for="studentSelect">① 請選擇您的姓名：</label>
    <select id="studentSelect" onchange="loadCurrentStatus()">
      <option value="">-- 正在載入學員名單... --</option>
    </select>
  </div>

  <div class="form-group">
    <label for="statusSelect">② 請選擇在職情況：</label>
    <select id="statusSelect">
      <option value="">-- 請選擇狀態 --</option>
      <option value="全職">全職</option>
      <option value="兼職">兼職</option>
      <option value="未在職">未在職</option>
    </select>
  </div>

  <button class="btn" id="submitBtn" onclick="updateStatus()">確認送出更新</button>

  <hr>

  <h3>📋 目前即時彙整名單</h3>
  <div id="loadingText" class="loading">正在向雲端同步最新資料...</div>
  <div class="result-box" id="resultDisplay"></div>
  <button class="btn copy-btn" onclick="copyResult()">📋 一鍵複製全部名單至 LINE 回報</button>
</div>

<script>
  // 您的 Google Apps Script 後端 API 網址
  const API_URL = "https://script.google.com/macros/s/AKfycbw0hiOQhcassV7iK6Hg6kvpWyV8l2pZOWuP1hZvWu-s1LkF2Da9luEDnguZLGa7EM_W/exec";

  let studentsData = [];

  window.onload = function() {
    fetchData();
  };

  function fetchData() {
    document.getElementById('loadingText').style.display = 'block';
    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        studentsData = data;
        renderDropdown();
        renderResult();
        document.getElementById('loadingText').style.display = 'none';
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('loadingText').textContent = '⚠️ 資料載入失敗，請重新整理網頁。';
      });
  }

  function renderDropdown() {
    const studentSelect = document.getElementById('studentSelect');
    studentSelect.innerHTML = '<option value="">-- 請點擊下拉選擇您的姓名 --</option>';
    studentsData.forEach((student) => {
      let opt = document.createElement('option');
      opt.value = student.id;
      opt.textContent = student.status ? `${student.id}. ${student.name} (已填: ${student.status})` : `${student.id}. ${student.name} (未填)`;
      studentSelect.appendChild(opt);
    });
  }

  function loadCurrentStatus() {
    const selectedId = document.getElementById('studentSelect').value;
    const statusSelect = document.getElementById('statusSelect');
    if (!selectedId) {
      statusSelect.value = "";
      return;
    }
    const student = studentsData.find(s => s.id == selectedId);
    statusSelect.value = student ? student.status : "";
  }

  function updateStatus() {
    const selectedId = document.getElementById('studentSelect').value;
    const selectedStatus = document.getElementById('statusSelect').value;

    if (!selectedId) {
      alert("⚠️ 請先選擇您的姓名！");
      return;
    }
    if (!selectedStatus) {
      alert("⚠️ 請選擇您的在職情況！");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = "正在同步更新至雲端...";

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ id: selectedId, status: selectedStatus })
    })
    .then(response => response.json())
    .then(data => {
      if(data.result === "success") {
        alert("✅ 填寫成功！資料已即時更新。");
        fetchData(); 
        document.getElementById('statusSelect').value = "";
        document.getElementById('studentSelect').value = "";
      } else {
        alert("⚠️ 更新失敗，請稍後再試。");
      }
      submitBtn.disabled = false;
      submitBtn.textContent = "確認送出更新";
    })
    .catch(error => {
      console.error('Error:', error);
      alert("⚠️ 網路連線發生錯誤，請稍後再試。");
      submitBtn.disabled = false;
      submitBtn.textContent = "確認送出更新";
    });
  }

  function renderResult() {
    let output = "📌 30+大學學員在職情況統計\n";
    studentsData.forEach(s => {
      output += `${s.id}. ${s.name}／${s.status}\n`;
    });
    document.getElementById('resultDisplay').textContent = output;
  }

  function copyResult() {
    const text = document.getElementById('resultDisplay').textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert("✅ 已成功複製最新名單！您可以直接貼回 LINE 群組向大家匯報。");
    });
  }
</script>

</body>
</html>
